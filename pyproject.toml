[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nicu-module1"
version = "0.1.0"
description = "Module 1: Infant Pose/Anatomy-Aware ROI Representation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "opencv-python>=4.9,<5",
  "PyYAML>=6.0,<7",
  "ultralytics>=8.3,<9",
  "lap>=0.5.12,<0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
