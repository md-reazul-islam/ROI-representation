# DataAugment configuration. Paths are relative to the project root (the folder that contains dataaugment/).
input_dir: data/ubfc             # read-only; never modified
output_dir: dataaugment/data
n_videos: 3
assignment: [motion, occlusion, lighting]   # video 1, 2, 3 (natural order: subject1, subject3, subject4)
seed: 20261114                   # base seed; each category gets SeedSequence([seed, category_index])
copy_ground_truth: true          # copy the UBFC ground_truth.txt next to every output (unchanged copy)
preview_frames: [0.1, 0.35, 0.6, 0.85]   # relative positions for preview contact sheets (PNG, preview only)

# Physiological bands used to check that the augmentation control signals contain no narrowband
# (respiration- or pulse-like) component. rr covers adult (9 bpm) to neonatal (90 bpm) respiration,
# hr covers 42-240 bpm.
bands_hz:
  rr: [0.15, 1.5]
  hr: [0.7, 4.0]
narrowband_power_threshold: 0.01
narrowband_peak_ratio: 10.0   # local prominence (bin power / running median)

motion:
  drift_cutoff_hz: 0.08          # slow, aperiodic camera drift (below the respiratory band)
  tremor_band_hz: [6.0, 10.0]    # hand tremor, above the heart-rate band
  interpolation: lanczos4        # lanczos4 | cubic | linear
  border_mode: constant          # constant (black) | reflect | replicate
  severities:
    small:  {translation_px: 8,  rotation_deg: 1.0, zoom_frac: 0.02, tremor_px_rms: 0.25}
    medium: {translation_px: 20, rotation_deg: 3.0, zoom_frac: 0.05, tremor_px_rms: 0.5}
    large:  {translation_px: 40, rotation_deg: 6.0, zoom_frac: 0.10, tremor_px_rms: 1.0}

occlusion:
  drift_cutoff_hz: 0.08
  hand_skin_bgr: [118, 148, 196]
  hand_path_x_face: 0.6          # hand wanders +-0.6 face widths around the face centre
  hand_path_y_face: 0.35
  hand_offset_y_face: 0.15
  hand_base_angle_deg: 15
  hand_rotation_deg: 15
  hand_shadow_strength: 0.25
  hand_shadow_offset_px: [6, 10]
  blanket_bgr: [214, 196, 172]   # pale blue cloth
  blanket_margin_px: 80
  blanket_drift_px: 25
  blanket_wave_amp_px: [14, 8, 4]
  blanket_wave_len_px: [380, 170, 75]
  blanket_wave_phase_drift_rad: 1.5
  blanket_feather_px: 4
  severities:                    # area_fraction = share of the image covered (hand + blanket union)
    small:  {area_fraction: 0.10, hand_share: 0.5}
    medium: {area_fraction: 0.25, hand_share: 0.35}
    large:  {area_fraction: 0.40, hand_share: 0.3}

lighting:
  drift_cutoff_hz: 0.05          # exposure / gradient / colour drift
  shadow_cutoff_hz: 0.05         # shadow movement
  dip_rate_max_hz: 0.12
  dip_recovery_s: 0.1
  shadow_path_x_face: 1.3
  shadow_path_y_face: 0.4
  shadow_sigma_face: [0.6, 0.8]
  mains_alias:                   # OFF: aliased 100/120 Hz flicker is a narrow line in the HR band
    enabled: false
    mains_hz: 60
    relative_amplitude: 1.0
  severities:
    small:  {exposure_ev: 0.15, gradient_amp: 0.06, color_temp_amp: 0.015, flicker_sigma: 0.004, dip_rate_hz: 0.03, dip_depth: 0.04, shadow_strength: 0.20}
    medium: {exposure_ev: 0.35, gradient_amp: 0.12, color_temp_amp: 0.03,  flicker_sigma: 0.008, dip_rate_hz: 0.06, dip_depth: 0.08, shadow_strength: 0.35}
    large:  {exposure_ev: 0.60, gradient_amp: 0.20, color_temp_amp: 0.06,  flicker_sigma: 0.015, dip_rate_hz: 0.12, dip_depth: 0.15, shadow_strength: 0.50}
